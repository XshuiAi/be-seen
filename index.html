<title>让自己被看见 · Sherry小水</title>
<!-- Sherry小水 · 豆包工作校园课 · 简历段网页（v2.0 电视机版，2026-11-03）。
     一叠带厚度的 3D 屏幕，往下滚一块块翻到正面；点正面那块屏幕，它放大成全屏，里面是这一站的完整内容和交互。
     右上角「音乐」开关：背景音乐用 Web Audio 实时合成（无音频文件、无版权问题）；翻屏、点开、收起、复制有音效。「扫码」按钮：默认隐藏，点开展示本页二维码（https://xshuiai.github.io/be-seen/）。
     8 块：封面 → 01 我是谁 → 02 我的叙事 → 03 做出作品 → 04 展示出来 → 05 机会找到我 → 06 AI 时代 → 收尾。
     单文件、无外部依赖、不联网也能打开（开源项目链接除外）。改前改后里的数字是示例。
     手写体「Sherry」「Be seen.」是 Great Vibes 字形转成的矢量（SIL Open Font License 1.1，Copyright 2015 The Great Vibes Pro Project Authors，https://github.com/googlefonts/great-vibes）。 -->
<style>
:root{
  --ink:#0e0e11;--ink2:#2a2a30;--sub:#6b6b74;--mute:#a4a4ac;--line:#ebebee;--soft:#f5f5f6;--paper:#fbfbfb;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.7}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;font-size:10.5px}

nav{position:fixed;left:0;right:0;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 36px;pointer-events:none}

.nlinks{display:flex;gap:22px}

.pill{justify-self:end;font-family:var(--mono);font-size:10px;letter-spacing:.2em;border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;background:#fff}

.open-hint{position:fixed;right:40px;bottom:40px;z-index:30;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12.5px;pointer-events:none;transition:opacity .4s}
.open-hint i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink);font-size:13px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.dots{position:fixed;right:40px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:12px}

.track{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;perspective:1700px;perspective-origin:50% 18%;
  background:radial-gradient(48% 46% at 50% 58%,#efeff1 0%,#f8f8f9 45%,#fff 78%)}
.scr{position:absolute;left:50%;top:56%;width:var(--w);height:var(--h);margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);transform-style:preserve-3d;will-change:transform,opacity}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr{background:linear-gradient(180deg,#f5f5f7,#e7e7ea);box-shadow:inset 0 1px 0 #fff,0 10px 0 -2px #d4d4d9,0 11px 0 -2px #c4c4ca;padding:32px 18px 18px}
.top,.bot{left:8px;right:8px;height:var(--d);border-radius:10px;background:linear-gradient(180deg,#fafafa,#dcdce0)}
.top{top:0;transform-origin:50% 0;transform:rotateX(90deg)}
.bot{top:auto;bottom:0;transform-origin:50% 100%;transform:rotateX(-90deg);background:linear-gradient(0deg,#f2f2f4,#d2d2d7)}

.dark .open{background:rgba(255,255,255,.12);color:#fff}

.ui{position:absolute;inset:0;padding:30px 32px;display:flex;flex-direction:column}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chips span{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chips span.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.dark .chips span.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bubble{align-self:flex-end;max-width:78%;margin-top:auto;background:var(--soft);border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:12px;line-height:1.6}

.reply{align-self:flex-start;max-width:78%;margin-top:8px;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:12px;line-height:1.6;color:var(--sub)}
.bignum{font-family:var(--mono);font-size:clamp(46px,7vw,72px);font-weight:700;letter-spacing:-.04em;line-height:1}
.minibars{display:grid;gap:8px}

.minibars i{height:6px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.minibars i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--ink);border-radius:inherit}
.minibars div:first-child i::after{background:var(--acc)}
.radar{position:absolute;right:30px;top:50%;width:150px;height:150px;margin-top:-75px;border-radius:50%;border:1px solid #26262c}
.radar::before{content:"";position:absolute;inset:30px;border-radius:50%;border:1px solid #26262c}
.radar::after{content:"你";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.radar i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#e9e9ee;box-shadow:0 0 12px rgba(255,255,255,.6)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,91,53,.3),transparent 25%);animation:sw 4s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.strike{font-size:13px;text-decoration:line-through;position:relative}
.after{margin-top:6px;font-size:15px;font-weight:700;line-height:1.6;max-width:440px;position:relative}
.repos{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.repos div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.5}

.repos span{font-family:var(--mono);color:var(--mute);font-size:10px}
.sig-s{width:150px;height:52px;fill:var(--acc);margin:6px 0 0 -6px;transform:rotate(-6deg);position:relative}

.veil{position:fixed;inset:0;z-index:60;background:rgba(245,245,247,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s}

.sheet{position:fixed;z-index:61;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;
  transition:top .6s var(--ease),left .6s var(--ease),width .6s var(--ease),height .6s var(--ease),border-radius .6s var(--ease),opacity .3s}
.sbar{flex:none;display:flex;align-items:center;gap:7px;padding:13px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}

.sbar .close{margin-left:auto;border:0;background:var(--soft);border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink)}
.sbody{flex:1;overflow:auto;opacity:0;transform:translateY(14px);transition:opacity .4s .2s,transform .5s .2s var(--ease);-webkit-overflow-scrolling:touch}

.doc{max-width:960px;margin:0 auto;padding:44px 40px 80px}
.doc .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.doc h2{margin:10px 0 10px;font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.02em;line-height:1.2}
.doc h2 em{font-style:normal;background:linear-gradient(transparent 64%,rgba(255,91,53,.3) 64%)}
.doc .lead{color:var(--sub);font-size:16px;max-width:680px;margin:0}
.blk{margin-top:44px}
.blk>h4{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:13px;font-weight:700}
.blk>h4 span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mute);font-weight:500}
.blk>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:14px 16px 14px 50px;border-radius:12px;background:var(--soft);font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center}
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:border-color .3s,transform .3s var(--ease)}

.pc .pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pc h5{margin:0;font-size:15px}
.pc pre{margin:0;flex:1;font-family:inherit;font-size:13px;line-height:1.75;white-space:pre-wrap;color:var(--ink2)}
.pc pre .ph2{color:var(--acc);font-weight:700}
.cp{align-self:flex-start;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;text-decoration:none;transition:.2s}
.cp.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.row2{display:flex;gap:8px;flex-wrap:wrap}
.flips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flip{perspective:900px;height:130px;border:0;background:none;padding:0;text-align:left}

.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}

.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.fm{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fm b{font-size:15px}
.fm small{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--mute)}

.fm .lv{display:flex;gap:3px;margin-top:4px}.fm .lv i{width:14px;height:4px;border-radius:2px;background:var(--line)}.fm .lv i.on{background:var(--ink)}
.filter{display:flex;gap:6px;margin-bottom:12px}

.whomap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-top:20px}

.orbit button{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;transition:.3s var(--ease)}

.donut .arc{transition:stroke-dashoffset 1.6s var(--ease)}
.donut p{margin:0;font-size:13.5px;color:var(--sub)}
.bars .r{display:grid;grid-template-columns:52px 1fr 64px;gap:10px;align-items:center;margin:12px 0;font-size:13px}
.bars .tk{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bars .fl{height:100%;width:0;border-radius:999px;background:var(--ink);transition:width 1.6s var(--ease)}
.bars .r:first-child .fl{background:var(--acc)}
.bars b{font-family:var(--mono);font-size:12.5px;text-align:right}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.skills span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.skills span.hot{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.stat .n{font-family:var(--mono);font-size:clamp(56px,8vw,96px);font-weight:700;letter-spacing:-.05em;line-height:1}
.stat .n small{font-family:inherit;font-size:.28em;letter-spacing:0;color:var(--acc);margin-left:4px}
.stat p{margin:0;color:var(--sub);max-width:420px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}
.flow span{padding:6px 12px;border-radius:999px;background:var(--soft);font-weight:700}
.flow em{font-style:normal;color:var(--mute)}
.label{max-width:400px;border:2px solid var(--ink);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.65}
.label h5{margin:0 0 6px;font-size:16px;border-bottom:4px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.label h5 small{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--mute)}
.label table{width:100%;border-collapse:collapse;margin:6px 0}
.label td{padding:3px 0;border-bottom:1px solid var(--line)}
.label td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
.label .w{margin-top:8px;padding:7px 9px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px}
.endq{font-size:clamp(26px,3.6vw,40px);font-weight:900;line-height:1.35;letter-spacing:-.01em;margin:6px 0 26px}
.endq em{font-style:normal;color:var(--acc)}
.signoff{display:flex;align-items:center;gap:6px;margin-top:24px}
.signoff svg{width:120px;height:52px;fill:var(--ink);transform:rotate(-5deg)}
.signoff b{font-size:20px;font-weight:900;margin-top:8px}
.src{font-size:11.5px;color:var(--mute);margin-top:30px}
.src a{color:var(--mute)}


/* ---------- 顶栏按钮：音乐 / 二维码 ---------- */
.tools{justify-self:end;display:flex;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:.25s}
.tbtn:hover,.tbtn.on{background:var(--ink);color:#fff}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:10px;font-style:normal}
.eq b{width:2px;height:3px;background:currentColor;border-radius:1px}
.tbtn.on .eq b{animation:eq .9s ease-in-out infinite}
.tbtn.on .eq b:nth-child(2){animation-delay:.2s}.tbtn.on .eq b:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:10px}}
.qrwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(245,245,247,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s}
.qrwrap.on{opacity:1;pointer-events:auto}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 34px 26px;border-radius:22px;background:#fff;box-shadow:0 40px 100px -30px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.05);transform:translateY(16px) scale(.96);transition:transform .5s var(--ease)}
.qrwrap.on .qrcard{transform:none}
.qrcard .mono{color:var(--mute)}
.qrbox{width:min(300px,64vw);aspect-ratio:1/1;padding:14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.qrbox svg{display:block;width:100%;height:100%}
.qrcard b{font-size:18px}
.qrcard span{font-family:var(--mono);font-size:11px;color:var(--sub);letter-spacing:.06em}
.qrcard .pill{cursor:pointer;margin-top:4px}
@media (max-width:820px){.tools .tbtn span{display:none}}
@media (max-width:820px){
  nav{grid-template-columns:1fr auto;padding:14px 16px}
  .nlinks{display:none}
  .cap{left:18px;bottom:22px}
  .open-hint{right:16px;bottom:22px}
  .open-hint span{display:none}
  .dots{right:10px}
  :root{--w:86vw;--h:min(430px,54vh);--d:18px}
  .ui{padding:24px 22px}
  .radar{width:100px;height:100px;margin-top:-50px;right:14px;top:62%}
  .repos{grid-template-columns:1fr 1fr}.repos div:nth-child(3){display:none}
  .doc{padding:30px 18px 70px}
  .flips{grid-template-columns:repeat(2,1fr)}
  .forms{grid-template-columns:repeat(2,1fr)}
  .oss a{grid-template-columns:1fr 60px}.oss .u,.oss p{display:none}
  .whomap{grid-template-columns:1fr}
  .abil{grid-template-columns:1fr 1fr}.abil div{border-bottom:1px solid var(--line)}
  .charts{grid-template-columns:1fr}
  .seg{display:flex;width:100%}.seg button{flex:1;padding:8px 4px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ================= 小工具 =================
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function steps(list, time){ return '<div class="blk"><h4>现场实操 <span>' + time + '</span></h4><ol class="steps">' + list.map(function(x){ return '<li>' + x + '</li>'; }).join("") + '</ol></div>'; }
function prompts(k){
  return '<div class="blk"><h4>复制提示词 <span>PROMPTS</span></h4><div class="prompts">' + CARDS[k].map(function(c, i){
    return '<div class="pc"><div class="ph"><i></i><i></i><i></i>' + c.slug + '<span>' + c.tag + '</span></div><div class="pb"><h5>' + c.name + '</h5><pre>' + esc(c.p).replace(/【[^】]*】/g, function(m){ return '<span class="ph2">' + m + '</span>'; }) + '</pre><div class="row2">'
      + (c.nocopy ? '' : '<button class="cp" data-k="' + k + '" data-i="' + i + '">复制提示词</button>')
      + (c.link ? '<a class="cp' + (c.nocopy ? '' : ' ghost') + '" href="' + c.link + '" target="_blank" rel="noopener">打开 GitHub ↗</a>' : '') + '</div></div></div>';
  }).join("") + '</div></div>';
}
function copyText(text, btn){
  var label = btn.textContent;
  var ok = function(){ btn.textContent = "已复制 ✓"; btn.classList.add("done"); setTimeout(function(){ btn.textContent = label; btn.classList.remove("done"); }, 1500); };
  var fb = function(t){ var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (x) {} ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, function(){ fb(text); ok(); }); else { fb(text); ok(); }
}
function countUp(el){ var to = +el.dataset.to, t0 = performance.now(); (function f(t){ var p = Math.min(1, (t - t0) / 1400); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0); }

// ================= 舞台：搭屏幕 =================
var stage = $("stage"), track = $("track"), els = [];
track.style.height = (SCREENS.length * 90 + 10) + "vh";
SCREENS.forEach(function(s, i){
  var el = document.createElement("div");
  el.className = "scr" + (s.dark ? " dark" : "") + (s.mist ? " mist" : "");
  el.innerHTML = '<div class="shadow"></div>'
    + '<div class="face fr"><div class="wbar"><i></i><i></i><i></i>' + s.k + '<span>' + pad(i) + ' / ' + pad(SCREENS.length - 1) + '</span></div>'
    + '<div class="glass" data-open="' + i + '">' + s.face + '<div class="open">⤢ 点开</div></div></div>';
  stage.appendChild(el); els.push(el);
});
$("nlinks").innerHTML = SCREENS.map(function(s, i){ return '<a href="#" data-go="' + i + '">' + pad(i) + '</a>'; }).join("");
$("dots").innerHTML = SCREENS.map(function(s, i){ return '<button data-go="' + i + '" aria-label="' + s.t + '"></button>'; }).join("");
var navs = document.querySelectorAll("#nlinks a"), dots = document.querySelectorAll("#dots button"), cur = -1, P = 0;

function goTo(i){
  var max = track.offsetHeight - innerHeight;
  scrollTo({top: track.offsetTop + i / (SCREENS.length - 1) * max, behavior: "smooth"});
}

// 滚动 → 每块屏幕的姿态：没到的藏在下面，当前的正对你，过去的翻平叠到上面
function render(){
  var max = track.offsetHeight - innerHeight, raw = Math.max(0, Math.min(1, (scrollY - track.offsetTop) / Math.max(1, max)));
  P = raw * (SCREENS.length - 1);
  $("progress").style.width = (raw * 100) + "%";
  var H = els[0].offsetHeight || 400;
  els.forEach(function(el, i){
    var d = i - P, rx, ty, tz = 0, sc = 1, op = 1;
    if (d >= 1) { rx = -80; ty = H * .9; op = 0; }
    else if (d > 0) { rx = -80 * d; ty = H * .9 * d; op = 1 - d * .7; }
    else {
      var a = Math.min(1, -d), b = Math.max(0, -d - 1), bb = Math.min(b, 4);
      rx = 76 * a; ty = -(H * .62 * a + bb * 26); tz = -bb * 30; sc = 1 - bb * .03; op = b > 3.5 ? Math.max(0, 1 - (b - 3.5) * 2) : 1;
    }
    el.style.transform = "translate3d(0," + ty.toFixed(1) + "px," + tz.toFixed(1) + "px) rotateX(" + rx.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")";
    el.style.opacity = op.toFixed(3);
    el.style.zIndex = 100 - Math.round(Math.abs(d) * 10);
    var front = Math.abs(d) < .35;
    el.style.pointerEvents = front ? "auto" : "none";
    el.classList.toggle("front", front);
  });
  var c = Math.round(P);
  if (c !== cur) {
    if (cur !== -1 && AC) SFX.flip();
    cur = c;
    navs.forEach(function(a, i){ a.classList.toggle("on", i === c); });
    dots.forEach(function(a, i){ a.classList.toggle("on", i === c); });
    $("capk").textContent = c === 0 ? "NOV 03 · 2026 · 对外经贸大学" : SCREENS[c].k;
    $("capt").textContent = SCREENS[c].t;
  }
  $("hint").style.opacity = Math.abs(P - Math.round(P)) < .2 ? 1 : 0;
}
addEventListener("scroll", render, {passive:true});
addEventListener("resize", render);
render();

// ================= 点开：屏幕放大成全屏 =================
var veil = $("veil"), sheet = null, openIdx = -1;
function fullRect(){
  var m = innerWidth < 820, w = m ? innerWidth : Math.min(1080, innerWidth - 80), h = m ? innerHeight : innerHeight - 64;
  return {left: (innerWidth - w) / 2, top: m ? 0 : 32, width: w, height: h};
}
function setRect(el, r){ el.style.left = r.left + "px"; el.style.top = r.top + "px"; el.style.width = r.width + "px"; el.style.height = r.height + "px"; }
function openScreen(i){
  if (sheet) return;
  openIdx = i;
  var s = SCREENS[i], r = els[i].querySelector(".glass").getBoundingClientRect();
  sheet = document.createElement("div"); sheet.className = "sheet";
  sheet.innerHTML = '<div class="sbar"><button class="tl" data-close aria-label="关闭"></button><button class="tl"></button><button class="tl"></button>' + s.k + '<button class="close" data-close>ESC · 收起</button></div><div class="sbody"><div class="doc">' + s.doc() + '</div></div>';
  setRect(sheet, {left: r.left, top: r.top, width: r.width, height: r.height}); sheet.style.borderRadius = "9px";
  document.body.appendChild(sheet);
  document.body.style.overflow = "hidden";
  veil.classList.add("on"); SFX.open();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ if (!sheet) return; setRect(sheet, fullRect()); sheet.style.borderRadius = innerWidth < 820 ? "0" : "16px"; }); });
  setTimeout(function(){ if (!sheet) return; sheet.classList.add("ready"); wire(i); }, 260);
}
function closeScreen(){
  if (!sheet) return;
  var sh = sheet; sheet = null;
  sh.classList.remove("ready");
  var r = els[openIdx].querySelector(".glass").getBoundingClientRect();
  setRect(sh, {left: r.left, top: r.top, width: r.width, height: r.height}); sh.style.borderRadius = "9px";
  veil.classList.remove("on"); SFX.close();
  setTimeout(function(){ sh.style.opacity = 0; }, 420);
  setTimeout(function(){ sh.remove(); document.body.style.overflow = ""; }, 720);
}
veil.addEventListener("click", closeScreen);
addEventListener("keydown", function(e){
  if (e.key === "Escape") { closeScreen(); return; }
  if (sheet) return;
  if (e.key === "Enter") openScreen(Math.round(P));
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "ArrowRight") { e.preventDefault(); goTo(Math.min(SCREENS.length - 1, Math.round(P) + 1)); }
  if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "ArrowLeft") { e.preventDefault(); goTo(Math.max(0, Math.round(P) - 1)); }
});

// 点开后各站的交互
function wire(i){
  var root = sheet, id = SCREENS[i].id;
  root.querySelectorAll(".cnt").forEach(countUp);
  if (id === "s4") renderOss("全部");
  if (id === "s5") showWho(0);
  if (id === "s6") setTimeout(function(){ var a = root.querySelector("#arc"); if (a) a.style.strokeDashoffset = (301.6 * .61).toFixed(1); root.querySelectorAll(".fl").forEach(function(f){ f.style.width = f.dataset.w + "%"; }); }, 200);
  var r = root.querySelector("#baR");
  if (r) r.addEventListener("input", function(){ root.querySelector("#ba2").style.clipPath = "inset(0 0 0 " + this.value + "%)"; root.querySelector("#knob").style.left = this.value + "%"; });
}
function renderOss(u){
  if (!sheet) return;
  sheet.querySelectorAll("[data-use]").forEach(function(b){ b.classList.toggle("on", b.dataset.use === u); });
  sheet.querySelector("#oss").innerHTML = OSS.filter(function(o){ return u === "全部" || o[0] === u; }).map(function(o){
    return '<a href="https://github.com/' + o[2] + '" target="_blank" rel="noopener"><span class="u">' + o[0] + '</span><b>' + o[1] + '</b><p>' + o[3] + '</p><span class="st">★ ' + o[4] + '</span></a>';
  }).join("");
}
function showWho(i){
  if (!sheet) return;
  sheet.querySelectorAll("[data-who]").forEach(function(b, j){ b.classList.toggle("on", j === i); });
  var w = WHO[i], d = sheet.querySelector("#detail");
  d.classList.add("out");
  setTimeout(function(){ d.innerHTML = '<small>' + w.tag + '</small><h5>' + w.s + '需要你</h5><p>' + w.d + '</p><p style="color:var(--ink)">' + w.ex + '</p><div class="first">' + w.first + '</div>'; d.classList.remove("out"); }, 160);
}

// ================= 声音：背景音乐（网页实时合成，不用音频文件、没有版权问题）+ 点击音效 =================
var AC = null, master = null, bgm = null, bgmOn = false;
function ac(){
  if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
// 一个短音：频率、时长、音色、音量、延迟
function tone(f, dur, type, vol, delay){
  var a = AC; if (!a || a.state !== "running") return;
  var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .08, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
var SFX = {
  flip: function(){ tone(1400, .05, "triangle", .035); tone(900, .07, "sine", .03, .03); },
  open: function(){ tone(523, .18, "sine", .07); tone(784, .26, "sine", .06, .07); tone(1047, .3, "sine", .03, .14); },
  close: function(){ tone(784, .16, "sine", .06); tone(523, .24, "sine", .05, .07); },
  tap: function(){ tone(1046, .07, "triangle", .05); },
  copy: function(){ tone(880, .08, "sine", .06); tone(1318, .16, "sine", .05, .06); }
};
// 背景音乐：慢速四个和弦铺底 + 稀疏的音点，8 秒一小节循环
var CHORDS = [[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];
function startBgm(){
  var a = ac(); if (!a) return;
  var out = a.createGain(); out.gain.value = 0; out.connect(master);
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300; lp.connect(out);
  out.gain.linearRampToValueAtTime(.55, a.currentTime + 2.5);
  var step = 0, timer;
  function pad(ch){
    var t = a.currentTime;
    ch.forEach(function(f, i){
      [-4, 4].forEach(function(det){
        var o = a.createOscillator(), g = a.createGain();
        o.type = i ? "sine" : "triangle"; o.frequency.value = f / 2; o.detune.value = det;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.025, t + 1.8); g.gain.linearRampToValueAtTime(.022, t + 6); g.gain.linearRampToValueAtTime(0, t + 8.6);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + 8.8);
      });
    });
  }
  function pluck(f, d){
    var t = a.currentTime + d, o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = f * 2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.03, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
    o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1.7);
  }
  function bar(){
    var ch = CHORDS[step % CHORDS.length]; step++;
    pad(ch);
    [0, 1, 2, 3, 5, 6].forEach(function(beat){ if (Math.random() < .55) pluck(ch[Math.floor(Math.random() * ch.length)], beat * 1.33); });
  }
  bar(); timer = setInterval(bar, 8000);
  bgm = {stop: function(){ clearInterval(timer); var t = a.currentTime; out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t); out.gain.linearRampToValueAtTime(0, t + 1.2); setTimeout(function(){ out.disconnect(); }, 1400); }};
}
$("bgmBtn").addEventListener("click", function(){
  bgmOn = !bgmOn; this.classList.toggle("on", bgmOn); this.setAttribute("aria-pressed", bgmOn);
  if (bgmOn) startBgm(); else if (bgm) { bgm.stop(); bgm = null; }
});
// 浏览器规定要先有一次点击才能出声：第一次点页面任何地方，就把音效打开
addEventListener("pointerdown", function(){ ac(); }, {once:true});

// ================= 二维码：默认藏起来，点按钮才展示 =================
function qr(on){ $("qrwrap").classList.toggle("on", on); $("qrwrap").setAttribute("aria-hidden", !on); $("qrBtn").classList.toggle("on", on); SFX.tap(); }
$("qrBtn").addEventListener("click", function(){ qr(!$("qrwrap").classList.contains("on")); });
$("qrClose").addEventListener("click", function(){ qr(false); });
$("qrwrap").addEventListener("click", function(e){ if (e.target === this) qr(false); });

document.addEventListener("click", function(e){
  var t;
  if ((t = e.target.closest("[data-open]")) && !sheet) { openScreen(+t.dataset.open); return; }
  if ((t = e.target.closest("[data-close]"))) { closeScreen(); return; }
  if ((t = e.target.closest("[data-go]"))) { e.preventDefault(); if (sheet) closeScreen(); goTo(+t.dataset.go); return; }
  if (e.target.closest("#home")) { e.preventDefault(); goTo(0); return; }
  if (!sheet) return;
  if ((t = e.target.closest(".cp[data-k]"))) { copyText(CARDS[t.dataset.k][+t.dataset.i].p, t); SFX.copy(); return; }
  if ((t = e.target.closest(".flip"))) { t.classList.toggle("on"); SFX.tap(); return; }
  if ((t = e.target.closest("[data-tell]"))) {
    var k = +t.dataset.tell, tell = sheet.querySelector("#tell"); SFX.tap();
    sheet.querySelectorAll("[data-tell]").forEach(function(b, j){ b.classList.toggle("on", j === k); });
    tell.classList.add("out"); setTimeout(function(){ tell.innerHTML = TELLINGS[k].t; sheet.querySelector("#who").textContent = TELLINGS[k].who; tell.classList.remove("out"); }, 200);
    return;
  }
  if ((t = e.target.closest("[data-use]"))) { renderOss(t.dataset.use); return; }
  if ((t = e.target.closest("[data-who]"))) { showWho(+t.dataset.who); SFX.tap(); return; }
});
